name: Deploy Rediseño S&OP Global

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/dazzling-turing-szyjli

      - name: Apply design changes
        run: |
          cat > src/index.css << 'EOF_SRC_INDEX_CSS'
          @import "tailwindcss";
          
          * { box-sizing: border-box; margin: 0; padding: 0; }
          
          body {
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            background: #F0F5F2;
            color: #1A2B25;
            -webkit-font-smoothing: antialiased;
          }
          
          #root {
            width: 100%;
            min-height: 100vh;
          }
          
          /* Stage pills */
          .stage-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 500;
          }
          .stage-1 { background: #E6F5ED; color: #009641; }
          .stage-2 { background: #E0F2EE; color: #007A65; }
          .stage-3 { background: #D6EDE7; color: #005A44; }
          .stage-done { background: #D6EDE7; color: #005A44; }
          
          /* Stepper connector */
          .step-connector {
            position: absolute;
            top: 12px;
            left: 60%;
            width: 80%;
            height: 2px;
            z-index: 0;
          }
          
          EOF_SRC_INDEX_CSS

          cat > src/components/Sidebar.jsx << 'EOF_SRC_COMPONENTS_SIDEBAR_JSX'
          import { useUsers } from '../context/UserContext';
          
          const ML_GREEN = '#009641';
          const ML_GREEN_LIGHT = '#E6F5ED';
          const BORDER = '0.5px solid rgba(0,150,65,0.15)';
          
          const navItems = [
            { id: 'dashboard', label: 'Dashboard', icon: '⊞' },
            { id: 'list', label: 'Discontinuados', icon: '⬡', badge: true },
            { id: 'comparativa', label: 'Comparativa', icon: '⇅' },
            { id: 'reports', label: 'Reportes', icon: '▤' },
            { id: 'history', label: 'Historial', icon: '↺' },
            { id: 'settings', label: 'Configuración', icon: '⚙' },
          ];
          
          const CLICKABLE = ['dashboard', 'list', 'comparativa', 'reports', 'settings'];
          
          export default function Sidebar({ activeView, onNavigate, productCount }) {
            const { currentUser, logout } = useUsers();
          
            return (
              <div style={{
                width: 200,
                background: '#fff',
                borderRight: BORDER,
                display: 'flex',
                flexDirection: 'column',
                flexShrink: 0,
                height: '100%',
              }}>
                {/* Header con degradado de marca */}
                <div style={{
                  padding: '18px 16px 16px',
                  background: 'linear-gradient(160deg, #004F3A 0%, #009982 100%)',
                  position: 'relative',
                  overflow: 'hidden',
                  flexShrink: 0,
                }}>
                  {/* Círculo decorativo sutil */}
                  <div style={{
                    position: 'absolute', top: -30, right: -30,
                    width: 100, height: 100, borderRadius: '50%',
                    background: 'rgba(255,255,255,0.05)',
                    pointerEvents: 'none',
                  }} />
                  <div style={{
                    fontSize: 9, fontWeight: 700, letterSpacing: '0.08em',
                    textTransform: 'uppercase', color: 'rgba(255,255,255,0.55)',
                    marginBottom: 6, display: 'flex', alignItems: 'center', gap: 5,
                  }}>
                    <span style={{
                      display: 'inline-block', width: 7, height: 7,
                      background: '#78D721', borderRadius: '50%',
                      boxShadow: '0 0 0 2px rgba(120,215,33,0.25)',
                    }} />
                    S&OP Global
                  </div>
                  <div style={{ fontSize: 15, fontWeight: 700, color: '#fff', letterSpacing: '-0.01em', lineHeight: 1.2 }}>
                    Megalabs
                  </div>
                  <div style={{ fontSize: 10, color: 'rgba(255,255,255,0.5)', marginTop: 2 }}>
                    Discontinuados Corp.
                  </div>
                </div>
          
                {/* Nav */}
                <nav style={{ flex: 1, padding: '6px 0', overflowY: 'auto' }}>
                  {navItems.map((item) => {
                    const isActive = activeView === item.id;
                    const isClickable = CLICKABLE.includes(item.id);
                    return (
                      <div
                        key={item.id}
                        onClick={() => isClickable && onNavigate(item.id)}
                        style={{
                          display: 'flex', alignItems: 'center', gap: 10,
                          padding: '8px 16px',
                          cursor: isClickable ? 'pointer' : 'default',
                          fontSize: 12.5,
                          color: isActive ? ML_GREEN : '#4E6358',
                          fontWeight: isActive ? 600 : 400,
                          background: isActive ? ML_GREEN_LIGHT : 'transparent',
                          borderLeft: isActive ? `2px solid ${ML_GREEN}` : '2px solid transparent',
                          transition: 'background 0.12s, color 0.12s',
                          opacity: isClickable ? 1 : 0.35,
                        }}
                        onMouseEnter={(e) => { if (!isActive && isClickable) e.currentTarget.style.background = '#E8F0EC'; }}
                        onMouseLeave={(e) => { if (!isActive) e.currentTarget.style.background = 'transparent'; }}
                      >
                        <span style={{ fontSize: 15, lineHeight: 1, width: 20, textAlign: 'center' }}>{item.icon}</span>
                        <span style={{ flex: 1 }}>{item.label}</span>
                        {item.badge && productCount > 0 && (
                          <span style={{ background: ML_GREEN, color: 'white', borderRadius: 10, fontSize: 10, fontWeight: 600, padding: '1px 7px' }}>
                            {productCount}
                          </span>
                        )}
                      </div>
                    );
                  })}
                </nav>
          
                {/* Current user */}
                {currentUser && (
                  <div style={{ padding: '10px 14px', borderTop: BORDER, background: '#F0F5F2' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <div style={{
                        width: 28, height: 28, borderRadius: '50%',
                        background: currentUser.color,
                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                        fontSize: 11, fontWeight: 700, color: '#fff', flexShrink: 0,
                      }}>
                        {currentUser.initials}
                      </div>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontSize: 12, fontWeight: 600, color: '#1A2B25', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{currentUser.nombre}</div>
                        <div style={{ fontSize: 10, color: '#6B7F76' }}>{currentUser.rol}</div>
                      </div>
                    </div>
                    <button
                      onClick={logout}
                      style={{ marginTop: 7, width: '100%', border: BORDER, background: '#fff', borderRadius: 6, padding: '4px', fontSize: 11, color: '#4E6358', cursor: 'pointer', fontFamily: 'inherit' }}
                    >
                      Cambiar usuario
                    </button>
                  </div>
                )}
              </div>
            );
          }
          
          EOF_SRC_COMPONENTS_SIDEBAR_JSX

          cat > src/components/LoginScreen.jsx << 'EOF_SRC_COMPONENTS_LOGINSCREEN_JSX'
          import { useUsers } from '../context/UserContext';
          
          const BORDER = '0.5px solid rgba(0,150,65,0.15)';
          
          export default function LoginScreen() {
            const { users, login } = useUsers();
          
            return (
              <div style={{
                minHeight: '100vh',
                background: 'linear-gradient(160deg, #004F3A 0%, #006B52 55%, #009982 100%)',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                position: 'relative',
                overflow: 'hidden',
              }}>
                {/* Círculos decorativos de fondo */}
                <div style={{
                  position: 'absolute', top: -100, right: -100,
                  width: 500, height: 500, borderRadius: '50%',
                  background: 'rgba(255,255,255,0.04)', pointerEvents: 'none',
                }} />
                <div style={{
                  position: 'absolute', bottom: -150, left: -80,
                  width: 400, height: 400, borderRadius: '50%',
                  background: 'rgba(120,215,33,0.07)', pointerEvents: 'none',
                }} />
          
                <div style={{
                  background: '#fff',
                  borderRadius: 16,
                  width: 360,
                  boxShadow: '0 20px 60px rgba(0,79,58,0.25)',
                  overflow: 'hidden',
                  position: 'relative', zIndex: 1,
                }}>
                  {/* Card header con degradado */}
                  <div style={{
                    padding: '24px 24px 20px',
                    background: 'linear-gradient(160deg, #004F3A 0%, #009982 100%)',
                    position: 'relative', overflow: 'hidden',
                  }}>
                    <div style={{
                      position: 'absolute', top: -40, right: -40,
                      width: 160, height: 160, borderRadius: '50%',
                      background: 'rgba(255,255,255,0.05)', pointerEvents: 'none',
                    }} />
                    <div style={{
                      fontSize: 9, fontWeight: 700, letterSpacing: '0.1em',
                      textTransform: 'uppercase', color: 'rgba(255,255,255,0.55)',
                      marginBottom: 8, display: 'flex', alignItems: 'center', gap: 6,
                    }}>
                      <span style={{
                        display: 'inline-block', width: 7, height: 7,
                        background: '#78D721', borderRadius: '50%',
                        boxShadow: '0 0 0 2px rgba(120,215,33,0.25)',
                      }} />
                      S&OP Global · Megalabs
                    </div>
                    <div style={{ fontSize: 22, fontWeight: 800, color: '#fff', letterSpacing: '-0.02em', lineHeight: 1.1 }}>
                      Discontinuados<br />Corporativos
                    </div>
                    <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.5)', marginTop: 5 }}>
                      Proceso PROC-SC-DISC-001 v3.0
                    </div>
                  </div>
          
                  {/* Body */}
                  <div style={{ padding: '22px 24px' }}>
                    <p style={{ fontSize: 12, fontWeight: 500, color: '#4E6358', marginBottom: 14 }}>
                      ¿Quién sos?
                    </p>
          
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                      {users.map((user) => (
                        <button
                          key={user.id}
                          onClick={() => login(user.id)}
                          style={{
                            display: 'flex', alignItems: 'center', gap: 12,
                            padding: '11px 14px',
                            border: BORDER,
                            borderRadius: 10,
                            background: '#fff',
                            cursor: 'pointer',
                            textAlign: 'left',
                            transition: 'background 0.12s, border-color 0.12s, transform 0.1s',
                            fontFamily: 'inherit',
                            width: '100%',
                          }}
                          onMouseEnter={(e) => {
                            e.currentTarget.style.background = '#F0F5F2';
                            e.currentTarget.style.borderColor = '#009641';
                            e.currentTarget.style.transform = 'translateX(2px)';
                          }}
                          onMouseLeave={(e) => {
                            e.currentTarget.style.background = '#fff';
                            e.currentTarget.style.borderColor = 'rgba(0,150,65,0.15)';
                            e.currentTarget.style.transform = 'none';
                          }}
                        >
                          <div style={{
                            width: 36, height: 36,
                            borderRadius: '50%',
                            background: user.color,
                            display: 'flex', alignItems: 'center', justifyContent: 'center',
                            fontSize: 12, fontWeight: 700, color: '#fff',
                            flexShrink: 0,
                          }}>
                            {user.initials}
                          </div>
                          <div style={{ flex: 1 }}>
                            <div style={{ fontSize: 13, fontWeight: 600, color: '#1A2B25' }}>{user.nombre}</div>
                            <div style={{ fontSize: 10, color: '#6B7F76' }}>{user.rol}</div>
                          </div>
                          <span style={{ color: '#9DB5A8', fontSize: 16 }}>›</span>
                        </button>
                      ))}
                    </div>
          
                    {users.length === 0 && (
                      <p style={{ fontSize: 12, color: '#6B7F76', textAlign: 'center', padding: '16px 0' }}>
                        No hay usuarios configurados.
                      </p>
                    )}
                  </div>
                </div>
              </div>
            );
          }
          
          EOF_SRC_COMPONENTS_LOGINSCREEN_JSX

          cat > src/components/NuevoProducto.jsx << 'EOF_SRC_COMPONENTS_NUEVOPRODUCTO_JSX'
          import { useState } from 'react';
          import { useApp } from '../context/AppContext';
          import { makeHitos, CIAS, FABRICANTES, BUS } from '../data/db';
          
          const ML_GREEN = '#009641';
          const BORDER = '0.5px solid rgba(0,150,65,0.15)';
          const BG_SEC = '#F0F5F2';
          
          function Field({ label, required, children }) {
            return (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                <label style={{ fontSize: 11, fontWeight: 500, color: '#5F5E5A' }}>
                  {label}{required && <span style={{ color: '#C0392B' }}> *</span>}
                </label>
                {children}
              </div>
            );
          }
          
          const inputStyle = {
            border: BORDER, borderRadius: 6, padding: '6px 10px',
            fontSize: 12, background: '#fff', outline: 'none', width: '100%',
          };
          
          export default function NuevoProducto({ onClose }) {
            const { addProduct } = useApp();
            const [form, setForm] = useState({
              codigo: '', nombre: '', paisCompania: '', paisPlanta: '', bu: '', mph: '', observaciones: '', levantadoSOPC: '',
            });
            const [errors, setErrors] = useState({});
            const [saving, setSaving] = useState(false);
          
            const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
          
            const validate = () => {
              const e = {};
              if (!form.nombre.trim()) e.nombre = 'Requerido';
              if (!form.paisCompania) e.paisCompania = 'Requerido';
              if (!form.paisPlanta) e.paisPlanta = 'Requerido';
              if (!form.bu) e.bu = 'Requerido';
              setErrors(e);
              return Object.keys(e).length === 0;
            };
          
            const handleSave = async () => {
              if (!validate()) return;
              setSaving(true);
              const now = new Date();
              const fecha = now.getDate().toString().padStart(2, '0') + '/' + (now.getMonth() + 1).toString().padStart(2, '0') + '/' + now.getFullYear();
              const ts = now.getDate().toString().padStart(2, '0') + '/' + (now.getMonth() + 1).toString().padStart(2, '0') + ' ' + now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
              const actividades = [
                { id: `A${Date.now()}`, text: 'Producto ingresado al proceso de discontinuados', time: ts },
              ];
              if (form.observaciones.trim()) {
                actividades.push({ id: `AO${Date.now()}`, text: `Observación: ${form.observaciones.trim()}`, time: ts });
              }
              const product = {
                id: `CU-${Date.now().toString().slice(-6)}`,
                codigo: form.codigo.trim(),
                nombre: form.nombre.trim(),
                paisCompania: form.paisCompania,
                paisPlanta: form.paisPlanta,
                bu: form.bu,
                mph: form.mph.trim(),
                observaciones: form.observaciones.trim(),
                levantadoSOPC: form.levantadoSOPC,
                etapaActual: 0,
                progreso: 0,
                ultimoHito: 'Inicio proceso',
                fechaUltimoHito: fecha,
                fechaInicio: fecha,
                etapas: [
                  { nombre: 'Detección', estado: 'en_progreso' },
                  { nombre: 'Análisis', estado: 'pendiente' },
                  { nombre: 'Confirmación', estado: 'pendiente' },
                ],
                hitos: makeHitos(),
                actividades,
              };
              addProduct(product);
              setSaving(false);
              onClose();
            };
          
            return (
              <div style={{
                position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.4)',
                display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 100,
              }}>
                <div style={{
                  background: '#fff', borderRadius: 10, width: 500,
                  boxShadow: '0 8px 32px rgba(0,0,0,0.15)', overflow: 'hidden',
                }}>
                  {/* Header */}
                  <div style={{ padding: '14px 16px', borderBottom: BORDER, display: 'flex', alignItems: 'center', justifyContent: 'space-between', background: BG_SEC }}>
                    <div style={{ fontSize: 14, fontWeight: 500, color: '#1A1A1A' }}>Nuevo producto</div>
                    <button onClick={onClose} style={{ background: 'none', border: 'none', fontSize: 16, cursor: 'pointer', color: '#5F5E5A' }}>✕</button>
                  </div>
          
                  {/* Form */}
                  <div style={{ padding: '16px', display: 'flex', flexDirection: 'column', gap: 12 }}>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 2fr', gap: 12 }}>
                      <Field label="Código">
                        <input value={form.codigo} onChange={set('codigo')} placeholder="002-001-1077" style={inputStyle} />
                      </Field>
                      <Field label="Descripción" required>
                        <input value={form.nombre} onChange={set('nombre')} placeholder="Ej: Amoxidal Duo Susp 750 mg x 70 ml" style={{ ...inputStyle, borderColor: errors.nombre ? '#C0392B' : undefined }} />
                        {errors.nombre && <span style={{ fontSize: 10, color: '#C0392B' }}>{errors.nombre}</span>}
                      </Field>
                    </div>
          
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                      <Field label="Cía" required>
                        <select value={form.paisCompania} onChange={set('paisCompania')} style={{ ...inputStyle, borderColor: errors.paisCompania ? '#C0392B' : undefined, cursor: 'pointer' }}>
                          <option value="">Seleccionar...</option>
                          {CIAS.map((c) => <option key={c}>{c}</option>)}
                        </select>
                        {errors.paisCompania && <span style={{ fontSize: 10, color: '#C0392B' }}>{errors.paisCompania}</span>}
                      </Field>
                      <Field label="Fabricante" required>
                        <select value={form.paisPlanta} onChange={set('paisPlanta')} style={{ ...inputStyle, borderColor: errors.paisPlanta ? '#C0392B' : undefined, cursor: 'pointer' }}>
                          <option value="">Seleccionar...</option>
                          {FABRICANTES.map((f) => <option key={f}>{f}</option>)}
                        </select>
                        {errors.paisPlanta && <span style={{ fontSize: 10, color: '#C0392B' }}>{errors.paisPlanta}</span>}
                      </Field>
                    </div>
          
                    <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: 12 }}>
                      <Field label="BU" required>
                        <select value={form.bu} onChange={set('bu')} style={{ ...inputStyle, borderColor: errors.bu ? '#C0392B' : undefined, cursor: 'pointer' }}>
                          <option value="">Seleccionar...</option>
                          {BUS.map((b) => <option key={b}>{b}</option>)}
                        </select>
                        {errors.bu && <span style={{ fontSize: 10, color: '#C0392B' }}>{errors.bu}</span>}
                      </Field>
                      <Field label="MPH">
                        <input value={form.mph} onChange={set('mph')} placeholder="—" style={inputStyle} />
                      </Field>
                    </div>
          
                    <Field label="¿Se levantó desde la planta?">
                      <div style={{ display: 'flex', gap: 16, alignItems: 'center', padding: '6px 0' }}>
                        {['Sí', 'No'].map((opt) => {
                          const val = opt === 'Sí' ? 'si' : 'no';
                          return (
                            <label key={opt} style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, color: '#1A1A1A', cursor: 'pointer' }}>
                              <input
                                type="radio"
                                name="levantadoSOPC"
                                checked={form.levantadoSOPC === val}
                                onChange={() => setForm((f) => ({ ...f, levantadoSOPC: val }))}
                                style={{ cursor: 'pointer' }}
                              />
                              {opt}
                            </label>
                          );
                        })}
                      </div>
                    </Field>
          
                    <Field label="Observaciones">
                      <textarea
                        value={form.observaciones}
                        onChange={set('observaciones')}
                        placeholder="Notas o aclaraciones sobre el discontinuado"
                        rows={2}
                        style={{ ...inputStyle, resize: 'vertical' }}
                      />
                    </Field>
          
                    <div style={{ background: BG_SEC, borderRadius: 6, padding: '10px 12px', fontSize: 11, color: '#5F5E5A', lineHeight: 1.5 }}>
                      Se crearán automáticamente los <strong>16 hitos estándar</strong> del proceso con estado Pendiente.
                    </div>
                  </div>
          
                  {/* Footer */}
                  <div style={{ padding: '12px 16px', borderTop: BORDER, display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
                    <button onClick={onClose} style={{ border: BORDER, background: '#fff', borderRadius: 6, padding: '7px 16px', fontSize: 12, color: '#5F5E5A', cursor: 'pointer' }}>
                      Cancelar
                    </button>
                    <button
                      onClick={handleSave}
                      disabled={saving}
                      style={{ background: ML_GREEN, color: '#fff', border: 'none', borderRadius: 6, padding: '7px 16px', fontSize: 12, fontWeight: 500, cursor: 'pointer', opacity: saving ? 0.7 : 1 }}
                    >
                      {saving ? 'Guardando...' : 'Crear producto'}
                    </button>
                  </div>
                </div>
              </div>
            );
          }
          // v2
          
          EOF_SRC_COMPONENTS_NUEVOPRODUCTO_JSX

          cat > src/pages/Dashboard.jsx << 'EOF_SRC_PAGES_DASHBOARD_JSX'
          import { useState } from 'react';
          import { useApp } from '../context/AppContext';
          import { HITOS_CON_EXTRAS, CIAS, FABRICANTES } from '../data/db';
          import NuevoProducto from '../components/NuevoProducto';
          import ImportModal from '../components/ImportModal';
          
          const ML_GREEN = '#009641';
          const ML_GREEN_LIGHT = '#E6F5ED';
          const ML_ORANGE = '#009641';
          const BORDER = '0.5px solid rgba(0,150,65,0.15)';
          const BG_SEC = '#F0F5F2';
          
          const STAGES = [
            { idx: 0, label: 'Detección',    color: '#009641', bg: '#E6F5ED', border: '#A8DABC' },
            { idx: 1, label: 'Análisis',     color: '#007A65', bg: '#E0F2EE', border: '#90CCC2' },
            { idx: 2, label: 'Confirmación', color: '#005A44', bg: '#D6EDE7', border: '#70B8A8' },
          ];
          
          function ProgressRing({ pct, color, size = 36 }) {
            const r = (size - 6) / 2;
            const circ = 2 * Math.PI * r;
            const offset = circ - (pct / 100) * circ;
            return (
              <svg width={size} height={size} style={{ flexShrink: 0 }}>
                <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#E5E7EB" strokeWidth={4} />
                <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={4}
                  strokeDasharray={circ} strokeDashoffset={offset}
                  strokeLinecap="round"
                  transform={`rotate(-90 ${size/2} ${size/2})`} />
                <text x={size/2} y={size/2 + 4} textAnchor="middle" fontSize={9} fontWeight={600} fill={color}>{pct}%</text>
              </svg>
            );
          }
          
          function ProductCard({ product, color, bg, onOpen }) {
            const { toggleHito } = useApp();
            const [hovered, setHovered] = useState(false);
            const doneHitos = product.hitos.filter(h => h.done).length;
            const totalHitos = product.hitos.length;
            const nextHito = product.hitos.find(h => !h.done);
          
            return (
              <div
                onClick={() => onOpen(product.id)}
                onMouseEnter={() => setHovered(true)}
                onMouseLeave={() => setHovered(false)}
                style={{
                  background: hovered ? '#fff' : '#FAFAFA',
                  border: `0.5px solid rgba(0,150,65,0.12)`,
                  borderLeft: `3px solid ${color}`,
                  borderRadius: 8,
                  padding: '10px 12px',
                  cursor: 'pointer',
                  transition: 'all 0.15s',
                  boxShadow: hovered ? '0 2px 8px rgba(0,0,0,0.08)' : 'none',
                }}
              >
                {/* SKU + progress */}
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 6 }}>
