                                <label key={opt} style={{ display: 'flex', alignItems: 'center', gap: 4, fontSize: 11, color: '#5F5E5A', cursor: 'pointer' }}>
                                  <input
                                    type="radio"
                                    checked={checked}
                                    onChange={() => updateHitoExtras(product.id, h.id, { impactoGranelLleva: val })}
                                    style={{ cursor: 'pointer' }}
                                  />
                                  {opt}
                                </label>
                              );
                            })}
                            <span style={{ fontSize: 11, color: '#5F5E5A', whiteSpace: 'nowrap' }}>%</span>
                            <input
                              type="text"
                              value={h.impactoGranelValor || ''}
                              onChange={(e) => updateHitoExtras(product.id, h.id, { impactoGranelValor: e.target.value })}
                              placeholder="0,0"
                              style={{ width: 80, border: '0.5px solid #D3D1C7', borderRadius: 4, padding: '3px 8px', fontSize: 11, background: '#fff', color: '#1A1A1A', outline: 'none' }}
                            />
                          </div>
                        );
                      };
          
                    return [0, 1, 2].map((etapaIdx) => {
                      const hitosEtapa = product.hitos.filter((h) => h.etapa === etapaIdx && h.label !== 'Análisis de impacto planta');
                      const etapaColors = ['#009641', '#007A65', '#005A44'];
                      const color = etapaColors[etapaIdx];
                      const doneCount = hitosEtapa.filter((h) => h.done).length;
                      return (
                        <div key={etapaIdx} style={{ borderBottom: BORDER }}>
                          <div style={{ padding: '8px 16px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', background: etapaIdx === product.etapaActual ? BG_SEC : '#fff' }}>
                            <span style={{ fontSize: 11, fontWeight: 600, color }}>{stageLabels[etapaIdx]}</span>
                            <span style={{ fontSize: 10, color: '#5F5E5A' }}>{doneCount}/{hitosEtapa.length} completados</span>
                          </div>
                          <div style={{ padding: '4px 16px 8px', display: 'flex', flexDirection: 'column', gap: 4 }}>
                            {etapaIdx === 1 ? (
                              <>
                                {renderHito(hitosEtapa.find((h) => h.label === 'Inventario PT'))}
                                {renderHito(hitosEtapa.find((h) => h.label === 'Notificación a Mkt Corp y Aviso a Planta'))}
                                <div style={{ borderRadius: 6, border: '0.5px solid #90CCC2', background: '#E8F5F2', padding: 8, display: 'flex', flexDirection: 'column', gap: 4, marginTop: 4 }}>
                                  <div style={{ fontSize: 10, fontWeight: 600, color: '#007A65', marginBottom: 2 }}>🏭 Análisis de impacto planta — Planta</div>
                                  <div style={{ borderRadius: 6, border: '0.5px solid rgba(0,150,65,0.2)', background: '#fff', padding: 6, display: 'flex', flexDirection: 'column', gap: 4 }}>
                                    <div style={{ fontSize: 10, fontWeight: 600, color: '#4E6358', padding: '2px 4px' }}>Costo destrucción</div>
                                    {['Costo destrucción PT', 'Costo destrucción materiales', 'Costo inventario API'].map((label) => renderHito(hitosEtapa.find((h) => h.label === label), true))}
                                  </div>
                                  {renderHito(hitosEtapa.find((h) => h.label === 'Productos en cola de producción'), true)}
                                  {renderHito(hitosEtapa.find((h) => h.label === 'Última OC'), true)}
                                  {renderImpactoGranel(product.hitos.find((h) => h.label === 'Análisis de impacto planta'))}
                                </div>
                              </>
                            ) : etapaIdx === 0 ? (
                              <>
                                {renderHito(hitosEtapa.find((h) => h.label === 'Detección del SKU a discontinuar'))}
                                <div style={{ borderRadius: 6, border: '0.5px solid #90CCC2', background: '#E0F2EE', padding: 6, display: 'flex', flexDirection: 'column', gap: 4, marginTop: 2, marginBottom: 2 }}>
                                  <div style={{ fontSize: 10, fontWeight: 600, color: '#007A65', marginBottom: 2 }}>★ Ruta Presupuesto Anual</div>
                                  {['Presentación de Presupuesto Anual', 'Análisis de Template de Discontinuación'].map((label) => renderHito(hitosEtapa.find((h) => h.label === label), true))}
                                </div>
                                {renderHito(hitosEtapa.find((h) => h.label === 'Aviso a Supply Corp y S&OP Global'))}
                              </>
                            ) : (
                              hitosEtapa.map((h) => renderHito(h))
                            )}
                          </div>
                        </div>
                      );
                    });
                    })()}
          
                    {/* Activity */}
                    <div style={{ padding: '10px 16px', borderBottom: BORDER }}>
                      <div style={{ fontSize: 11, fontWeight: 600, color: '#4E6358', marginBottom: 8, textTransform: 'uppercase', letterSpacing: '0.06em' }}>Historial de actividades</div>
                      {!product.actividades || product.actividades.length === 0 ? (
                        <div style={{ fontSize: 11, color: '#5F5E5A' }}>Sin actividad registrada.</div>
                      ) : (
                        product.actividades.map((a) => (
                          <div key={a.id} style={{ display: 'flex', gap: 8, alignItems: 'flex-start', marginBottom: 6 }}>
                            <div style={{ width: 6, height: 6, borderRadius: '50%', background: ML_GREEN, marginTop: 5, flexShrink: 0 }} />
                            <div>
                              <div style={{ fontSize: 11, color: '#1A1A1A' }}>{a.text}</div>
                              <div style={{ fontSize: 10, color: '#5F5E5A' }}>{a.time}</div>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
          
                    {/* Comment box */}
                    <div style={{ padding: '10px 16px' }}>
                      <div style={{ fontSize: 11, fontWeight: 600, color: '#4E6358', marginBottom: 6, textTransform: 'uppercase', letterSpacing: '0.06em' }}>Agregar comentario</div>
                      <div style={{ display: 'flex', gap: 6 }}>
                        <input
                          value={comment}
                          onChange={(e) => setComment(e.target.value)}
                          onKeyDown={(e) => e.key === 'Enter' && handleSend()}
                          placeholder="Escribí tu comentario o actualización..."
                          style={{
                            flex: 1,
                            border: BORDER,
                            borderRadius: 6,
                            padding: '6px 10px',
                            fontSize: 12,
                            background: BG_SEC,
                            color: '#1A1A1A',
                            outline: 'none',
                          }}
                        />
                        <button
                          onClick={handleSend}
                          style={{ background: ML_GREEN, color: 'white', border: 'none', borderRadius: 6, padding: '6px 12px', fontSize: 12, cursor: 'pointer' }}
                        >
                          Enviar
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            );
          }
          
          EOF_SRC_PAGES_PRODUCTDETAIL_JSX

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run build

      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-tmp
          git --work-tree=dist add -A
          git --work-tree=dist commit -m "Deploy: rediseño paleta S&OP Global"
          git push origin gh-pages-tmp:gh-pages -f
