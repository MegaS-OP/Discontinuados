name: Deploy Rediseño S&OP Global

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/dazzling-turing-szyjli

      - name: Apply design changes
        run: |
          node << 'NODEOF'
          const fs = require('fs');

          // index.css
          let css = fs.readFileSync('src/index.css', 'utf8');
          css = css
            .replace('background: #F1EFE8', 'background: #F0F5F2')
            .replace('color: #1A1A1A', 'color: #1A2B25')
            .replace('#E6F1FB; color: #185FA5', '#E6F5ED; color: #009641')
            .replace('#FAEEDA; color: #854F0B', '#E0F2EE; color: #007A65')
            .replace('#EAF3DE; color: #3B6D11', '#D6EDE7; color: #005A44')
            .replace('#E1F5EE; color: #0F6E56', '#D6EDE7; color: #005A44');
          fs.writeFileSync('src/index.css', css);

          // Dashboard.jsx
          let d = fs.readFileSync('src/pages/Dashboard.jsx', 'utf8');
          d = d
            .replace("const ML_GREEN = '#0F6E56'", "const ML_GREEN = '#009641'")
            .replace("const ML_GREEN_LIGHT = '#E1F5EE'", "const ML_GREEN_LIGHT = '#E6F5ED'")
            .replace("const ML_ORANGE = '#F5A623'", "const ML_ORANGE = '#009641'")
            .replace("'0.5px solid #D3D1C7'", "'0.5px solid rgba(0,150,65,0.15)'")
            .replace("const BG_SEC = '#F1EFE8'", "const BG_SEC = '#F0F5F2'")
            .replace("color: '#185FA5', bg: '#E6F1FB', border: '#B8D4F0'", "color: '#009641', bg: '#E6F5ED', border: '#A8DABC'")
            .replace("color: '#854F0B', bg: '#FAEEDA', border: '#F0D4A0'", "color: '#007A65', bg: '#E0F2EE', border: '#90CCC2'")
            .replace("color: '#3B6D11', bg: '#EAF3DE', border: '#C0D9A0'", "color: '#005A44', bg: '#D6EDE7', border: '#70B8A8'")
            .replace("color: '#1A1A1A' }}>Dashboard \u2014 Seguimiento Discontinuados</div>", "color: '#1A2B25', fontWeight: 700 }}>Discontinuados</div>")
            .replace("fontWeight: 500, color: '#1A1A1A' }}>{value}</div>", "fontWeight: 700, color: valueColor || '#1A2B25' }}>{value}</div>")
            .replace("valueColor={"#185FA5"}", "valueColor={"#009641"}")
            .replace("valueColor={"#854F0B"}", "valueColor={"#007A65"}")
            .replace("valueColor={"#3B6D11"}", "valueColor={"#005A44"}");
          fs.writeFileSync('src/pages/Dashboard.jsx', d);

          // ProductDetail.jsx
          let p = fs.readFileSync('src/pages/ProductDetail.jsx', 'utf8');
          p = p
            .replace("const ML_GREEN = '#0F6E56'", "const ML_GREEN = '#009641'")
            .replace("const ML_GREEN_LIGHT = '#E1F5EE'", "const ML_GREEN_LIGHT = '#E6F5ED'")
            .replace("const ML_ORANGE = '#F5A623'", "const ML_ORANGE = '#007A65'")
            .replace("'0.5px solid #D3D1C7'", "'0.5px solid rgba(0,150,65,0.15)'")
            .replace("const BG_SEC = '#F1EFE8'", "const BG_SEC = '#F0F5F2'")
            .replace("['#185FA5', '#854F0B', '#3B6D11']", "['#009641', '#007A65', '#005A44']");
          fs.writeFileSync('src/pages/ProductDetail.jsx', p);

          // NuevoProducto.jsx
          let n = fs.readFileSync('src/components/NuevoProducto.jsx', 'utf8');
          n = n
            .replace("const ML_GREEN = '#0F6E56'", "const ML_GREEN = '#009641'")
            .replace("const BORDER = '0.5px solid #D3D1C7'", "const BORDER = '0.5px solid rgba(0,150,65,0.15)'")
            .replace("const BG_SEC = '#F1EFE8'", "const BG_SEC = '#F0F5F2'");
          fs.writeFileSync('src/components/NuevoProducto.jsx', n);

          console.log('Design tokens applied');
          NODEOF

          cat > src/components/Sidebar.jsx << 'EOF_SIDEBAR'
          import { useUsers } from '../context/UserContext';
          
          const ML_GREEN = '#009641';
          const ML_GREEN_LIGHT = '#E6F5ED';
          const BORDER = '0.5px solid rgba(0,150,65,0.15)';
          
          const navItems = [
            { id: 'dashboard', label: 'Dashboard', icon: '⊞' },
            { id: 'list', label: 'Discontinuados', icon: '⬡', badge: true },
            { id: 'comparativa', label: 'Comparativa', icon: '⇅' },
            { id: 'reports', label: 'Reportes', icon: '▤' },
            { id: 'history', label: 'Historial', icon: '↺' },
            { id: 'settings', label: 'Configuración', icon: '⚙' },
          ];
          
          const CLICKABLE = ['dashboard', 'list', 'comparativa', 'reports', 'settings'];
          
          export default function Sidebar({ activeView, onNavigate, productCount }) {
            const { currentUser, logout } = useUsers();
          
            return (
              <div style={{
                width: 200,
                background: '#fff',
                borderRight: BORDER,
                display: 'flex',
                flexDirection: 'column',
                flexShrink: 0,
                height: '100%',
              }}>
                {/* Header con degradado de marca */}
                <div style={{
                  padding: '18px 16px 16px',
                  background: 'linear-gradient(160deg, #004F3A 0%, #009982 100%)',
                  position: 'relative',
                  overflow: 'hidden',
                  flexShrink: 0,
                }}>
                  {/* Círculo decorativo sutil */}
                  <div style={{
                    position: 'absolute', top: -30, right: -30,
                    width: 100, height: 100, borderRadius: '50%',
                    background: 'rgba(255,255,255,0.05)',
                    pointerEvents: 'none',
                  }} />
                  <div style={{
                    fontSize: 9, fontWeight: 700, letterSpacing: '0.08em',
                    textTransform: 'uppercase', color: 'rgba(255,255,255,0.55)',
                    marginBottom: 6, display: 'flex', alignItems: 'center', gap: 5,
                  }}>
                    <span style={{
                      display: 'inline-block', width: 7, height: 7,
                      background: '#78D721', borderRadius: '50%',
                      boxShadow: '0 0 0 2px rgba(120,215,33,0.25)',
                    }} />
                    S&OP Global
                  </div>
                  <div style={{ fontSize: 15, fontWeight: 700, color: '#fff', letterSpacing: '-0.01em', lineHeight: 1.2 }}>
                    Megalabs
                  </div>
                  <div style={{ fontSize: 10, color: 'rgba(255,255,255,0.5)', marginTop: 2 }}>
                    Discontinuados Corp.
                  </div>
                </div>
          
                {/* Nav */}
                <nav style={{ flex: 1, padding: '6px 0', overflowY: 'auto' }}>
                  {navItems.map((item) => {
                    const isActive = activeView === item.id;
                    const isClickable = CLICKABLE.includes(item.id);
                    return (
                      <div
                        key={item.id}
                        onClick={() => isClickable && onNavigate(item.id)}
                        style={{
                          display: 'flex', alignItems: 'center', gap: 10,
                          padding: '8px 16px',
                          cursor: isClickable ? 'pointer' : 'default',
                          fontSize: 12.5,
                          color: isActive ? ML_GREEN : '#4E6358',
                          fontWeight: isActive ? 600 : 400,
                          background: isActive ? ML_GREEN_LIGHT : 'transparent',
                          borderLeft: isActive ? `2px solid ${ML_GREEN}` : '2px solid transparent',
                          transition: 'background 0.12s, color 0.12s',
                          opacity: isClickable ? 1 : 0.35,
                        }}
                        onMouseEnter={(e) => { if (!isActive && isClickable) e.currentTarget.style.background = '#E8F0EC'; }}
                        onMouseLeave={(e) => { if (!isActive) e.currentTarget.style.background = 'transparent'; }}
                      >
                        <span style={{ fontSize: 15, lineHeight: 1, width: 20, textAlign: 'center' }}>{item.icon}</span>
                        <span style={{ flex: 1 }}>{item.label}</span>
                        {item.badge && productCount > 0 && (
                          <span style={{ background: ML_GREEN, color: 'white', borderRadius: 10, fontSize: 10, fontWeight: 600, padding: '1px 7px' }}>
                            {productCount}
                          </span>
                        )}
                      </div>
                    );
                  })}
                </nav>
          
                {/* Current user */}
                {currentUser && (
                  <div style={{ padding: '10px 14px', borderTop: BORDER, background: '#F0F5F2' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <div style={{
                        width: 28, height: 28, borderRadius: '50%',
                        background: currentUser.color,
                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                        fontSize: 11, fontWeight: 700, color: '#fff', flexShrink: 0,
                      }}>
                        {currentUser.initials}
                      </div>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontSize: 12, fontWeight: 600, color: '#1A2B25', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{currentUser.nombre}</div>
                        <div style={{ fontSize: 10, color: '#6B7F76' }}>{currentUser.rol}</div>
                      </div>
                    </div>
                    <button
                      onClick={logout}
                      style={{ marginTop: 7, width: '100%', border: BORDER, background: '#fff', borderRadius: 6, padding: '4px', fontSize: 11, color: '#4E6358', cursor: 'pointer', fontFamily: 'inherit' }}
                    >
                      Cambiar usuario
                    </button>
                  </div>
                )}
              </div>
            );
          }
          
          EOF_SIDEBAR

          cat > src/components/LoginScreen.jsx << 'EOF_LOGIN'
          import { useUsers } from '../context/UserContext';
          
          const BORDER = '0.5px solid rgba(0,150,65,0.15)';
          
          export default function LoginScreen() {
            const { users, login } = useUsers();
          
            return (
              <div style={{
                minHeight: '100vh',
                background: 'linear-gradient(160deg, #004F3A 0%, #006B52 55%, #009982 100%)',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                position: 'relative',
                overflow: 'hidden',
              }}>
                {/* Círculos decorativos de fondo */}
                <div style={{
                  position: 'absolute', top: -100, right: -100,
                  width: 500, height: 500, borderRadius: '50%',
                  background: 'rgba(255,255,255,0.04)', pointerEvents: 'none',
                }} />
                <div style={{
                  position: 'absolute', bottom: -150, left: -80,
                  width: 400, height: 400, borderRadius: '50%',
                  background: 'rgba(120,215,33,0.07)', pointerEvents: 'none',
                }} />
          
                <div style={{
                  background: '#fff',
                  borderRadius: 16,
                  width: 360,
                  boxShadow: '0 20px 60px rgba(0,79,58,0.25)',
                  overflow: 'hidden',
                  position: 'relative', zIndex: 1,
                }}>
                  {/* Card header con degradado */}
                  <div style={{
                    padding: '24px 24px 20px',
                    background: 'linear-gradient(160deg, #004F3A 0%, #009982 100%)',
                    position: 'relative', overflow: 'hidden',
                  }}>
                    <div style={{
                      position: 'absolute', top: -40, right: -40,
                      width: 160, height: 160, borderRadius: '50%',
                      background: 'rgba(255,255,255,0.05)', pointerEvents: 'none',
                    }} />
                    <div style={{
                      fontSize: 9, fontWeight: 700, letterSpacing: '0.1em',
                      textTransform: 'uppercase', color: 'rgba(255,255,255,0.55)',
                      marginBottom: 8, display: 'flex', alignItems: 'center', gap: 6,
                    }}>
                      <span style={{
                        display: 'inline-block', width: 7, height: 7,
                        background: '#78D721', borderRadius: '50%',
                        boxShadow: '0 0 0 2px rgba(120,215,33,0.25)',
                      }} />
                      S&OP Global · Megalabs
                    </div>
                    <div style={{ fontSize: 22, fontWeight: 800, color: '#fff', letterSpacing: '-0.02em', lineHeight: 1.1 }}>
                      Discontinuados<br />Corporativos
                    </div>
                    <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.5)', marginTop: 5 }}>
                      Proceso PROC-SC-DISC-001 v3.0
                    </div>
                  </div>
          
                  {/* Body */}
                  <div style={{ padding: '22px 24px' }}>
                    <p style={{ fontSize: 12, fontWeight: 500, color: '#4E6358', marginBottom: 14 }}>
                      ¿Quién sos?
                    </p>
          
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                      {users.map((user) => (
                        <button
                          key={user.id}
                          onClick={() => login(user.id)}
                          style={{
                            display: 'flex', alignItems: 'center', gap: 12,
                            padding: '11px 14px',
                            border: BORDER,
                            borderRadius: 10,
                            background: '#fff',
                            cursor: 'pointer',
                            textAlign: 'left',
                            transition: 'background 0.12s, border-color 0.12s, transform 0.1s',
                            fontFamily: 'inherit',
                            width: '100%',
                          }}
                          onMouseEnter={(e) => {
                            e.currentTarget.style.background = '#F0F5F2';
                            e.currentTarget.style.borderColor = '#009641';
                            e.currentTarget.style.transform = 'translateX(2px)';
                          }}
                          onMouseLeave={(e) => {
                            e.currentTarget.style.background = '#fff';
                            e.currentTarget.style.borderColor = 'rgba(0,150,65,0.15)';
                            e.currentTarget.style.transform = 'none';
                          }}
                        >
                          <div style={{
                            width: 36, height: 36,
                            borderRadius: '50%',
                            background: user.color,
                            display: 'flex', alignItems: 'center', justifyContent: 'center',
                            fontSize: 12, fontWeight: 700, color: '#fff',
                            flexShrink: 0,
                          }}>
                            {user.initials}
                          </div>
                          <div style={{ flex: 1 }}>
                            <div style={{ fontSize: 13, fontWeight: 600, color: '#1A2B25' }}>{user.nombre}</div>
                            <div style={{ fontSize: 10, color: '#6B7F76' }}>{user.rol}</div>
                          </div>
                          <span style={{ color: '#9DB5A8', fontSize: 16 }}>›</span>
                        </button>
                      ))}
                    </div>
          
                    {users.length === 0 && (
                      <p style={{ fontSize: 12, color: '#6B7F76', textAlign: 'center', padding: '16px 0' }}>
                        No hay usuarios configurados.
                      </p>
                    )}
                  </div>
                </div>
              </div>
            );
          }
          
          EOF_LOGIN

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run build

      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-tmp
          git --work-tree=dist add -A
          git --work-tree=dist commit -m "Deploy: rediseño paleta S&OP Global"
          git push origin gh-pages-tmp:gh-pages -f
