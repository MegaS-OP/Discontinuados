name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/dazzling-turing-szyjli]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/dazzling-turing-szyjli

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run build

      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-tmp
          git --work-tree=dist add -A
          git --work-tree=dist commit -m "Deploy via GitHub Actions"
          git push origin gh-pages-tmp:gh-pages -f
