name: Publicar CEAM (Firebase Hosting)

on:
  push:
    branches:
      - claude/app-cambios-tracking-dinamica-i9wkbx
    paths:
      - 'public/cambios.html'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-ceam.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
      - name: Publicar en Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CEAM }}
          projectId: abastecimiento-ceam
          channelId: live
