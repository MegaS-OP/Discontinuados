<title>Editor — Discontinuados Megalabs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',Arial,sans-serif;background:#0D1F1A;color:#E4F5EC}
.editor-bar{display:flex;align-items:center;gap:6px;background:#085041;padding:7px 12px;flex-wrap:wrap;border-bottom:2px solid #0F6E56}
.sep{width:1px;height:24px;background:#1D9E75;opacity:.4;margin:0 2px}
.btn{padding:5px 12px;border:none;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;font-family:inherit;transition:all .15s;white-space:nowrap}
.btn-mode{background:rgba(255,255,255,.10);color:#E4F5EC}
.btn-mode:hover{background:rgba(255,255,255,.18)}
.btn-mode.active{background:#0F6E56;color:white;box-shadow:0 0 0 2px #9FE1CB}
.btn-action{background:rgba(255,255,255,.10);color:#E4F5EC}
.btn-action:hover{background:rgba(255,255,255,.18)}
.btn-action:disabled{opacity:.35;cursor:default}
.btn-del{background:rgba(220,50,50,.18);color:#FCA5A5}
.btn-del:hover{background:rgba(220,50,50,.3)}
.btn-del:disabled{opacity:.35;cursor:default}
.palette{display:none;align-items:center;gap:4px;flex-wrap:wrap}
.palette.show{display:flex}
.pitem{padding:4px 9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:5px;cursor:pointer;font-size:10px;color:#9FE1CB;white-space:nowrap}
.pitem:hover,.pitem.active{background:#0F6E56;color:white;border-color:#0F6E56}
.conn-opts{display:none;align-items:center;gap:5px}
.conn-opts.show{display:flex}
.conn-opts label{font-size:10px;color:#9FE1CB}
.conn-opts select{background:#085041;color:#E4F5EC;border:1px solid #1D9E75;border-radius:4px;font-size:10px;padding:2px 4px;font-family:inherit}
.color-opts{display:none;align-items:center;gap:5px}
.color-opts.show{display:flex}
.color-opts label{font-size:10px;color:#9FE1CB}
.color-opts input[type=color]{width:28px;height:22px;border:none;border-radius:3px;cursor:pointer;padding:1px}
.hint{font-size:10px;color:#9FE1CB;margin-left:4px}
.tabs{display:flex;background:#0F6E56}
.tab{padding:10px 28px;cursor:pointer;color:#9FE1CB;font-size:12px;font-weight:600;border-bottom:3px solid transparent;transition:all .2s;user-select:none}
.tab:hover{color:white;background:rgba(255,255,255,.08)}
.tab.active{color:white;border-bottom:3px solid #b8f0dc;background:rgba(255,255,255,.12)}
.panel{display:none;background:white;overflow:auto;position:relative}
.panel.active{display:block}
.panel svg{display:block}
</style>

<div class="editor-bar">
  <button class="btn btn-mode active" id="btnSelect" onclick="setMode('select')">↖ Seleccionar</button>
  <button class="btn btn-mode" id="btnPlace" onclick="setMode('place')">＋ Agregar forma</button>
  <button class="btn btn-mode" id="btnArrow" onclick="setMode('arrow')">→ Dibujar flecha</button>
  <div class="sep"></div>

  <div class="palette" id="palette">
    <span style="font-size:10px;color:#9FE1CB">Forma:</span>
    <div class="pitem active" data-shape="task" onclick="selectShape(this)">□ Tarea</div>
    <div class="pitem" data-shape="start" onclick="selectShape(this)">◯ Inicio</div>
    <div class="pitem" data-shape="end" onclick="selectShape(this)">⬤ Fin</div>
    <div class="pitem" data-shape="xor" onclick="selectShape(this)">◇X Gateway XOR</div>
    <div class="pitem" data-shape="and" onclick="selectShape(this)">◇+ Gateway AND</div>
    <div class="pitem" data-shape="inter" onclick="selectShape(this)">◎ Evento Int.</div>
    <div class="pitem" data-shape="annot" onclick="selectShape(this)">[ Anotación</div>
  </div>

  <div class="conn-opts" id="connOpts">
    <label>Línea:</label>
    <select id="selStroke" onchange="applyConnStyle()">
      <option value="solid">Sólida</option>
      <option value="dashed">Discontinua</option>
      <option value="dotted">Punteada</option>
    </select>
    <label>Flecha:</label>
    <select id="selArrow" onchange="applyConnStyle()">
      <option value="end">→ Final</option>
      <option value="both">↔ Ambos</option>
      <option value="none">— Sin flecha</option>
    </select>
    <label>Color:</label>
    <select id="selConnColor" onchange="applyConnStyle()">
      <option value="#0F6E56">Verde (principal)</option>
      <option value="#1D9E75">Verde claro</option>
      <option value="#D4A017">Ámbar</option>
      <option value="#6B7280">Gris</option>
    </select>
  </div>

  <div class="color-opts" id="colorOpts">
    <label>Relleno:</label>
    <input type="color" id="colorFill" value="#ffffff" oninput="applyNodeColor()">
    <label>Borde:</label>
    <input type="color" id="colorStroke" value="#0F6E56" oninput="applyNodeColor()">
    <label>Texto:</label>
    <input type="color" id="colorText" value="#0F6E56" oninput="applyTextColor()">
  </div>

  <div class="sep"></div>
  <button class="btn btn-action" id="btnUndo" onclick="undo()" disabled>↩ Deshacer</button>
  <button class="btn btn-del" id="btnDel" onclick="deleteSelected()" disabled>🗑 Borrar</button>
  <span class="hint" id="hint">Seleccioná un modo para comenzar</span>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('flujo',this)">📊 Diagrama de Flujo</div>
  <div class="tab" onclick="switchTab('raci',this)">📋 Matriz RACI</div>
</div>

<script>
const NS='http://www.w3.org/2000/svg';
let mode='select', placeShape='task';
let activeSVG=null, groups=[], connectors=[], selected=null;
let drag=null, wpDrag=null, undoStack=[];
let arrowSrc=null, previewLine=null;

document.addEventListener('DOMContentLoaded',()=>{
  activeSVG=document.getElementById('svgFlujo');
  buildModel(activeSVG);
  attach(activeSVG);
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==='z'){undo();e.preventDefault();}
    if(e.key==='Delete'||e.key==='Backspace'){if(selected&&document.activeElement===document.body)deleteSelected();}
    if(e.key==='Escape'){cancelArrow();deselect();}
  });
});

function switchTab(id,el){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  el.classList.add('active');
  cancelArrow(); deselect();
  activeSVG=id==='flujo'?document.getElementById('svgFlujo'):document.getElementById('svgRaci');
  buildModel(activeSVG); attach(activeSVG);
}

// ── Mode ──────────────────────────────────────────
function setMode(m){
  mode=m;
  document.querySelectorAll('.btn-mode').forEach(b=>b.classList.remove('active'));
  document.getElementById(m==='select'?'btnSelect':m==='place'?'btnPlace':'btnArrow').classList.add('active');
  document.getElementById('palette').classList.toggle('show',m==='place');
  document.getElementById('connOpts').classList.toggle('show',m==='arrow');
  const hints={select:'Clic→seleccionar · Arrastrar→mover · Doble clic en texto→editar · Clic en flecha→puntos de control',place:'Clic en el diagrama para agregar la forma seleccionada',arrow:'Clic en nodo origen, luego en nodo destino para dibujar flecha'};
  document.getElementById('hint').textContent=hints[m];
  if(m!=='arrow')cancelArrow();
  if(m!=='select')deselect();
  activeSVG.style.cursor=m==='place'?'crosshair':m==='arrow'?'crosshair':'default';
}

function selectShape(el){
  document.querySelectorAll('.pitem').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  placeShape=el.dataset.shape;
}

// ── Model ──────────────────────────────────────────
function isNode(el){
  const tag=el.tagName;
  if(tag==='polygon')return true;
  if(tag==='circle'){const r=+el.getAttribute('r');return r>=12&&r<=25;}
  if(tag==='rect'){
    const x=+el.getAttribute('x')|0,y=+el.getAttribute('y')|0;
    const w=+el.getAttribute('width')|0,h=+el.getAttribute('height')|0;
    const fill=el.getAttribute('fill')||'',stroke=el.getAttribute('stroke')||'';
    if(w>380||h>220)return false;
    if(x<=0||(y<35&&h>40))return false;
    if(!stroke||stroke==='none')return false;
    const dark=['#0F6E56','#085041','#0a5c45'];
    if(dark.includes(fill)&&!(w<130&&h<30))return false;
    if(y>=744)return false;
    return true;
  }
  return false;
}

function bb(sh){
  const tag=sh.tagName;
  if(tag==='rect')return{x:+sh.getAttribute('x'),y:+sh.getAttribute('y'),w:+sh.getAttribute('width'),h:+sh.getAttribute('height')};
  if(tag==='circle'){const cx=+sh.getAttribute('cx'),cy=+sh.getAttribute('cy'),r=+sh.getAttribute('r');return{x:cx-r,y:cy-r,w:r*2,h:r*2};}
  if(tag==='polygon'){
    const nums=sh.getAttribute('points').trim().split(/[\s,]+/).map(Number);
    const xs=[],ys=[];for(let i=0;i<nums.length;i+=2){xs.push(nums[i]);ys.push(nums[i+1]);}
    const mx=Math.min(...xs),my=Math.min(...ys);return{x:mx,y:my,w:Math.max(...xs)-mx,h:Math.max(...ys)-my};
  }
  return{x:0,y:0,w:0,h:0};
}

function buildModel(svg){
  groups=[];connectors=[];
  const shapes=[...svg.querySelectorAll('rect,polygon,circle')].filter(isNode);
  const allT=[...svg.querySelectorAll('text')];
  const pad=55;
  for(const sh of shapes){
    const b=bb(sh);
    const texts=allT.filter(t=>{
      const tx=+t.getAttribute('x')|0,ty=+t.getAttribute('y')|0;
      return tx>=b.x-pad&&tx<=b.x+b.w+pad&&ty>=b.y-pad&&ty<=b.y+b.h+pad;
    });
    groups.push({sh,texts,b});
  }
  connectors=[...svg.querySelectorAll('path,line')].filter(el=>{
    if(el.classList.contains('sel')||el.classList.contains('wph'))return false;
    return true;
  }).map(el=>({el,wps:parsePath(el.getAttribute('d')||''),handles:[]}));
}

function parsePath(d){
  const wps=[],re=/([ML])\s*([-\d.]+)[\s,]+([-\d.]+)/g;let m;
  while((m=re.exec(d)))wps.push({cmd:m[1],x:+m[2],y:+m[3]});
  return wps;
}
function wpsToD(wps){return wps.map(w=>`${w.cmd}${w.x} ${w.y}`).join(' ');}

// ── Handlers ───────────────────────────────────────
function attach(svg){
  svg.onmousedown=onDown;svg.onmousemove=onMove;svg.onmouseup=onUp;
  svg.onmouseleave=onUp;svg.ondblclick=onDbl;
}

function svgPt(e){
  const pt=activeSVG.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
  return pt.matrixTransform(activeSVG.getScreenCTM().inverse());
}

function onDown(e){
  if(mode==='place'){placeNode(svgPt(e));e.preventDefault();return;}
  if(mode==='arrow'){handleArrowClick(e);e.preventDefault();return;}
  if(mode!=='select')return;
  const t=e.target;
  if(t.dataset.wci!==undefined){wpDrag={ci:+t.dataset.wci,wi:+t.dataset.wii};saveHistory();e.stopPropagation();e.preventDefault();return;}
  if(t.tagName==='path'||t.tagName==='line'){
    const idx=connectors.findIndex(c=>c.el===t);
    if(idx>=0){deselect();selectPath(idx);showConnOpts(connectors[idx]);e.stopPropagation();return;}
  }
  const p=svgPt(e);
  const gi=hitGroup(p.x,p.y);
  if(gi>=0){
    deselect();selectGroup(gi);showColorOpts(groups[gi]);
    saveHistory();
    drag={gi,sx:p.x,sy:p.y,orig:captureGroup(groups[gi])};
    e.preventDefault();return;
  }
  deselect();
}

function onMove(e){
  if(mode==='arrow'&&arrowSrc&&previewLine){
    const p=svgPt(e);
    previewLine.setAttribute('x2',p.x);previewLine.setAttribute('y2',p.y);return;
  }
  if(mode!=='select')return;
  if(!drag&&!wpDrag)return;
  const p=svgPt(e);
  if(wpDrag){
    const c=connectors[wpDrag.ci];
    c.wps[wpDrag.wi].x=Math.round(p.x);c.wps[wpDrag.wi].y=Math.round(p.y);
    c.el.setAttribute('d',wpsToD(c.wps));
    const h=activeSVG.querySelector(`[data-wci="${wpDrag.ci}"][data-wii="${wpDrag.wi}"]`);
    if(h){h.setAttribute('cx',Math.round(p.x));h.setAttribute('cy',Math.round(p.y));}
    return;
  }
  if(drag){
    const dx=Math.round(p.x-drag.sx),dy=Math.round(p.y-drag.sy);
    applyGroup(groups[drag.gi],drag.orig,dx,dy);
    groups[drag.gi].b=bb(groups[drag.gi].sh);
    updateRing(groups[drag.gi].b);
  }
}

function onUp(){drag=null;wpDrag=null;}

function onDbl(e){
  if(mode!=='select')return;
  let t=e.target;
  if(t.tagName==='tspan')t=t.parentElement;
  if(t.tagName!=='text')return;
  editText(t);e.preventDefault();
}

// ── Arrow drawing ──────────────────────────────────
function handleArrowClick(e){
  const p=svgPt(e);
  const gi=hitGroup(p.x,p.y);
  if(!arrowSrc){
    if(gi<0)return;
    arrowSrc=groups[gi];
    const cx=arrowSrc.b.x+arrowSrc.b.w/2,cy=arrowSrc.b.y+arrowSrc.b.h/2;
    previewLine=document.createElementNS(NS,'line');
    previewLine.setAttribute('x1',cx);previewLine.setAttribute('y1',cy);
    previewLine.setAttribute('x2',cx);previewLine.setAttribute('y2',cy);
    previewLine.setAttribute('stroke','#2563EB');previewLine.setAttribute('stroke-width','2');
    previewLine.setAttribute('stroke-dasharray','6,3');previewLine.setAttribute('pointer-events','none');
    previewLine.classList.add('sel');
    activeSVG.appendChild(previewLine);
    document.getElementById('hint').textContent='Ahora clic en el nodo destino (Escape para cancelar)';
  } else {
    if(gi<0){cancelArrow();return;}
    const src=arrowSrc,dst=groups[gi];
    cancelArrow();
    saveHistory();
    drawArrow(src,dst);
    buildModel(activeSVG);
  }
}

function cancelArrow(){
  if(previewLine)previewLine.remove();
  previewLine=null;arrowSrc=null;
  if(mode==='arrow')document.getElementById('hint').textContent='Clic en nodo origen, luego en nodo destino para dibujar flecha';
}

function drawArrow(src,dst){
  const sx=src.b.x+src.b.w/2,sy=src.b.y+src.b.h/2;
  const dx=dst.b.x+dst.b.w/2,dy=dst.b.y+dst.b.h/2;
  const color=document.getElementById('selConnColor').value;
  const strokeVal=document.getElementById('selStroke').value;
  const arrowType=document.getElementById('selArrow').value;
  const markerId=color===#D4A017?'arrO':color==='#6B7280'?'arrGray':'arr';
  const p=document.createElementNS(NS,'path');
  p.setAttribute('d',`M${sx} ${sy} L${dx} ${dy}`);
  p.setAttribute('fill','none');
  p.setAttribute('stroke',color);
  p.setAttribute('stroke-width','1.8');
  if(strokeVal==='dashed')p.setAttribute('stroke-dasharray','6,3');
  else if(strokeVal==='dotted')p.setAttribute('stroke-dasharray','2,3');
  if(arrowType==='end'||arrowType==='both')p.setAttribute('marker-end',`url(#${markerId})`);
  if(arrowType==='both'){
    const startId=color==='#D4A017'?'arrStartO':color==='#6B7280'?'arrStartGray':'arrStart';
    p.setAttribute('marker-start',`url(#${startId})`);
  }
  p.dataset.userConn='1';
  activeSVG.appendChild(p);
}

// ── Place node ─────────────────────────────────────
function placeNode(p){
  saveHistory();
  const x=Math.round(p.x),y=Math.round(p.y);
  const shapes={
    task:()=>createTask(x,y),
    start:()=>createEvent(x,y,'start'),
    end:()=>createEvent(x,y,'end'),
    xor:()=>createGateway(x,y,'X'),
    and:()=>createGateway(x,y,'+'),
    inter:()=>createEvent(x,y,'inter'),
    annot:()=>createAnnotation(x,y)
  };
  (shapes[placeShape]||shapes.task)();
  buildModel(activeSVG);
}

function createTask(cx,cy){
  const w=130,h=50,x=cx-w/2,y=cy-h/2;
  const r=document.createElementNS(NS,'rect');
  r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',w);r.setAttribute('height',h);
  r.setAttribute('rx','6');r.setAttribute('fill','white');r.setAttribute('stroke','#0F6E56');r.setAttribute('stroke-width','1.5');
  const t=document.createElementNS(NS,'text');
  t.setAttribute('x',cx);t.setAttribute('y',cy+4);
  t.setAttribute('text-anchor','middle');t.setAttribute('font-family','Arial');t.setAttribute('font-size','9');
  t.setAttribute('font-weight','700');t.setAttribute('fill','#0F6E56');
  t.textContent='Nueva tarea';
  activeSVG.appendChild(r);activeSVG.appendChild(t);
}

function createEvent(cx,cy,type){
  const r=type==='end'?16:15;
  const c=document.createElementNS(NS,'circle');
  c.setAttribute('cx',cx);c.setAttribute('cy',cy);c.setAttribute('r',r);
  if(type==='end'){c.setAttribute('fill','#0F6E56');c.setAttribute('stroke','none');}
  else{c.setAttribute('fill','white');c.setAttribute('stroke','#0F6E56');c.setAttribute('stroke-width','2');}
  if(type==='inter'){
    const c2=document.createElementNS(NS,'circle');
    c2.setAttribute('cx',cx);c2.setAttribute('cy',cy);c2.setAttribute('r',r-4);
    c2.setAttribute('fill','none');c2.setAttribute('stroke','#0F6E56');c2.setAttribute('stroke-width','1.5');
    activeSVG.appendChild(c);activeSVG.appendChild(c2);
  } else {
    if(type==='start'){
      const c2=document.createElementNS(NS,'circle');
      c2.setAttribute('cx',cx);c2.setAttribute('cy',cy);c2.setAttribute('r',r-5);
      c2.setAttribute('fill','none');c2.setAttribute('stroke','#0F6E56');c2.setAttribute('stroke-width','1.5');
      activeSVG.appendChild(c);activeSVG.appendChild(c2);
    } else {
      activeSVG.appendChild(c);
      const inner=document.createElementNS(NS,'circle');
      inner.setAttribute('cx',cx);inner.setAttribute('cy',cy);inner.setAttribute('r','8');
      inner.setAttribute('fill','none');inner.setAttribute('stroke','white');inner.setAttribute('stroke-width','2');
      activeSVG.appendChild(inner);
    }
  }
  const t=document.createElementNS(NS,'text');
  t.setAttribute('x',cx);t.setAttribute('y',cy+r+12);
  t.setAttribute('text-anchor','middle');t.setAttribute('font-family','Arial');t.setAttribute('font-size','8');
  t.setAttribute('fill','#0F6E56');t.textContent=type==='end'?'FIN':'Inicio';
  activeSVG.appendChild(t);
}

function createGateway(cx,cy,symbol){
  const s=22;
  const poly=document.createElementNS(NS,'polygon');
  poly.setAttribute('points',`${cx},${cy-s} ${cx+s},${cy} ${cx},${cy+s} ${cx-s},${cy}`);
  poly.setAttribute('fill','white');poly.setAttribute('stroke','#0F6E56');poly.setAttribute('stroke-width','1.5');
  const t=document.createElementNS(NS,'text');
  t.setAttribute('x',cx);t.setAttribute('y',cy+4);
  t.setAttribute('text-anchor','middle');t.setAttribute('font-family','Arial');
  t.setAttribute('font-size',symbol==='+'?'14':'12');t.setAttribute('font-weight','700');t.setAttribute('fill','#0F6E56');
  t.textContent=symbol;
  activeSVG.appendChild(poly);activeSVG.appendChild(t);
}

function createAnnotation(cx,cy){
  const w=120,h=40,x=cx-w/2,y=cy-h/2;
  const path=document.createElementNS(NS,'path');
  path.setAttribute('d',`M${x+15} ${y} L${x} ${y} L${x} ${y+h} L${x+15} ${y+h}`);
  path.setAttribute('fill','none');path.setAttribute('stroke','#085041');path.setAttribute('stroke-width','1.5');
  const t=document.createElementNS(NS,'text');
  t.setAttribute('x',cx);t.setAttribute('y',cy+4);
  t.setAttribute('text-anchor','middle');t.setAttribute('font-family','Arial');t.setAttribute('font-size','8.5');t.setAttribute('fill','#085041');
  t.textContent='Anotación';
  activeSVG.appendChild(path);activeSVG.appendChild(t);
}

// ── Selection ─────────────────────────────────────
function deselect(){
  activeSVG&&activeSVG.querySelectorAll('.sel,.wph').forEach(el=>el.remove());
  selected=null;
  document.getElementById('btnDel').disabled=true;
  document.getElementById('colorOpts').classList.remove('show');
  document.getElementById('connOpts').classList.toggle('show',mode==='arrow');
}

function selectGroup(gi){
  selected={type:'group',gi};
  const g=groups[gi];g.b=bb(g.sh);drawRing(g.b);
  document.getElementById('btnDel').disabled=false;
}

function selectPath(ci){
  selected={type:'path',ci};drawWps(connectors[ci],ci);
  document.getElementById('btnDel').disabled=false;
}

function showColorOpts(g){
  document.getElementById('colorOpts').classList.add('show');
  document.getElementById('connOpts').classList.remove('show');
  const fill=g.sh.getAttribute('fill')||'#ffffff';
  const stroke=g.sh.getAttribute('stroke')||'#0F6E56';
  try{document.getElementById('colorFill').value=toHex(fill);}catch(e){}
  try{document.getElementById('colorStroke').value=toHex(stroke);}catch(e){}
  if(g.texts.length>0){
    const tc=g.texts[0].getAttribute('fill')||'#0F6E56';
    try{document.getElementById('colorText').value=toHex(tc);}catch(e){}
  }
}

function showConnOpts(c){
  document.getElementById('colorOpts').classList.remove('show');
  document.getElementById('connOpts').classList.add('show');
  const dash=c.el.getAttribute('stroke-dasharray')||'';
  document.getElementById('selStroke').value=dash.includes('2,3')?'dotted':dash?'dashed':'solid';
  const me=c.el.getAttribute('marker-end')||'';
  const ms=c.el.getAttribute('marker-start')||'';
  document.getElementById('selArrow').value=ms?'both':me?'end':'none';
  const s=c.el.getAttribute('stroke')||'#0F6E56';
  const colorSel=document.getElementById('selConnColor');
  for(let opt of colorSel.options)if(opt.value===s){colorSel.value=s;break;}
}

function toHex(c){
  if(c&&c[0]==='#'){if(c.length===4)return'#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];return c;}
  return '#0F6E56';
}

function applyNodeColor(){
  if(!selected||selected.type!=='group')return;
  const g=groups[selected.gi];
  saveHistory();
  g.sh.setAttribute('fill',document.getElementById('colorFill').value);
  g.sh.setAttribute('stroke',document.getElementById('colorStroke').value);
}

function applyTextColor(){
  if(!selected||selected.type!=='group')return;
  const g=groups[selected.gi];
  const tc=document.getElementById('colorText').value;
  g.texts.forEach(t=>t.setAttribute('fill',tc));
}

function applyConnStyle(){
  if(!selected||selected.type!=='path')return;
  const c=connectors[selected.ci];
  const color=document.getElementById('selConnColor').value;
  const strokeVal=document.getElementById('selStroke').value;
  const arrowType=document.getElementById('selArrow').value;
  const markerId=color==='#D4A017'?'arrO':color==='#6B7280'?'arrGray':'arr';
  const startMarkerId=color==='#D4A017'?'arrStartO':color==='#6B7280'?'arrStartGray':'arrStart';
  c.el.setAttribute('stroke',color);
  if(strokeVal==='dashed')c.el.setAttribute('stroke-dasharray','6,3');
  else if(strokeVal==='dotted')c.el.setAttribute('stroke-dasharray','2,3');
  else c.el.removeAttribute('stroke-dasharray');
  if(arrowType==='end'){c.el.setAttribute('marker-end',`url(#${markerId})`);c.el.removeAttribute('marker-start');}
  else if(arrowType==='both'){c.el.setAttribute('marker-end',`url(#${markerId})`);c.el.setAttribute('marker-start',`url(#${startMarkerId})`);}
  else{c.el.removeAttribute('marker-end');c.el.removeAttribute('marker-start');}
}

// ── Delete ─────────────────────────────────────────
function deleteSelected(){
  if(!selected)return;
  saveHistory();
  if(selected.type==='group'){
    const g=groups[selected.gi];
    g.sh.remove();g.texts.forEach(t=>t.remove());
  } else if(selected.type==='path'){
    connectors[selected.ci].el.remove();
  }
  deselect();buildModel(activeSVG);
}

// ── Visual helpers ─────────────────────────────────
function drawRing(b){
  const p=6,r=document.createElementNS(NS,'rect');
  r.setAttribute('class','sel');
  r.setAttribute('x',b.x-p);r.setAttribute('y',b.y-p);
  r.setAttribute('width',b.w+p*2);r.setAttribute('height',b.h+p*2);
  r.setAttribute('rx','10');r.setAttribute('fill','none');
  r.setAttribute('stroke','#2563EB');r.setAttribute('stroke-width','2');
  r.setAttribute('stroke-dasharray','6,3');r.setAttribute('pointer-events','none');
  activeSVG.appendChild(r);
}

function updateRing(b){
  const p=6,r=activeSVG.querySelector('.sel');
  if(!r)return;
  r.setAttribute('x',b.x-p);r.setAttribute('y',b.y-p);
  r.setAttribute('width',b.w+p*2);r.setAttribute('height',b.h+p*2);
}

function drawWps(c,ci){
  c.handles=[];
  for(let wi=0;wi<c.wps.length;wi++){
    const wp=c.wps[wi];
    const h=document.createElementNS(NS,'circle');
    h.setAttribute('class','wph');h.setAttribute('data-wci',ci);h.setAttribute('data-wii',wi);
    h.setAttribute('cx',wp.x);h.setAttribute('cy',wp.y);h.setAttribute('r','7');
    h.setAttribute('fill',wp.cmd==='M'?'#2563EB':'#93C5FD');
    h.setAttribute('stroke','white');h.setAttribute('stroke-width','2');h.style.cursor='crosshair';
    activeSVG.appendChild(h);c.handles[wi]=h;
  }
}

// ── Hit detection ──────────────────────────────────
function hitGroup(x,y){
  for(let i=groups.length-1;i>=0;i--){
    const g=groups[i],b=g.b;
    if(g.sh.tagName==='circle'){
      const cx=+g.sh.getAttribute('cx'),cy=+g.sh.getAttribute('cy'),r=+g.sh.getAttribute('r');
      if(Math.hypot(x-cx,y-cy)<=r)return i;
    } else {
      if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)return i;
    }
  }
  return -1;
}

// ── Drag ──────────────────────────────────────────
function captureGroup(g){
  const sh=g.sh,tag=sh.tagName;
  let shData;
  if(tag==='rect')shData={x:sh.getAttribute('x'),y:sh.getAttribute('y')};
  else if(tag==='circle')shData={cx:sh.getAttribute('cx'),cy:sh.getAttribute('cy')};
  else if(tag==='polygon')shData={points:sh.getAttribute('points')};
  const textData=g.texts.map(t=>({x:t.getAttribute('x'),y:t.getAttribute('y'),tf:t.getAttribute('transform')}));
  return{shData,textData};
}

function applyGroup(g,orig,dx,dy){
  const sh=g.sh,tag=sh.tagName;
  if(tag==='rect'){sh.setAttribute('x',+orig.shData.x+dx);sh.setAttribute('y',+orig.shData.y+dy);}
  else if(tag==='circle'){sh.setAttribute('cx',+orig.shData.cx+dx);sh.setAttribute('cy',+orig.shData.cy+dy);}
  else if(tag==='polygon'){
    const nums=orig.shData.points.trim().split(/[\s,]+/).map(Number);
    const pts=[];for(let i=0;i<nums.length;i+=2)pts.push(`${nums[i]+dx},${nums[i+1]+dy}`);
    sh.setAttribute('points',pts.join(' '));
  }
  g.texts.forEach((t,i)=>{
    const o=orig.textData[i];
    if(o.x!==null)t.setAttribute('x',+o.x+dx);
    if(o.y!==null)t.setAttribute('y',+o.y+dy);
    if(o.tf){const nt=o.tf.replace(/translate\(([-\d.]+),\s*([-\d.]+)\)/,(_,tx,ty)=>`translate(${+tx+dx},${+ty+dy})`);t.setAttribute('transform',nt);}
  });
}

// ── Text edit ─────────────────────────────────────
function editText(textEl){
  const pt=activeSVG.createSVGPoint();
  pt.x=+textEl.getAttribute('x')||0;pt.y=+textEl.getAttribute('y')||0;
  const scr=pt.matrixTransform(activeSVG.getScreenCTM());
  const inp=document.createElement('input');
  inp.type='text';inp.value=textEl.textContent.trim();
  const fs=Math.max(11,(+textEl.getAttribute('font-size')||10)*(activeSVG.getBoundingClientRect().width/1800)*1.4);
  Object.assign(inp.style,{position:'fixed',left:(scr.x-50)+'px',top:(scr.y-14)+'px',width:'220px',fontFamily:'Arial,sans-serif',fontSize:fs+'px',border:'2px solid #2563EB',borderRadius:'4px',padding:'2px 6px',outline:'none',zIndex:'9999',background:'white',color:'#162219',boxShadow:'0 2px 12px rgba(0,0,0,.25)'});
  document.body.appendChild(inp);inp.focus();inp.select();
  const commit=()=>{textEl.textContent=inp.value;inp.remove();};
  const cancel=()=>inp.remove();
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'){inp.removeEventListener('blur',commit);commit();}
    if(ev.key==='Escape'){inp.removeEventListener('blur',commit);cancel();}
    ev.stopPropagation();
  });
}

// ── History ───────────────────────────────────────
function saveHistory(){
  undoStack.push(activeSVG.innerHTML);
  if(undoStack.length>30)undoStack.shift();
  document.getElementById('btnUndo').disabled=false;
}

function undo(){
  if(!undoStack.length)return;
  activeSVG.innerHTML=undoStack.pop();
  buildModel(activeSVG);attach(activeSVG);
  if(!undoStack.length)document.getElementById('btnUndo').disabled=true;
  deselect();
}
</script>
